<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>在线录音 - 免费在线工具</title>
  <meta name="description" content="免费在线录音工具，浏览器录音，波形动画显示，下载音频文件">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar"><a href="../tools.html" class="logo">🛠 在线工具箱</a><a href="../tools.html" class="nav-link">← 返回</a></nav>
  <div class="tool-page">
    <h1>🎙️ 在线录音</h1>
    <p class="subtitle">浏览器录音，波形显示，下载音频</p>
    <div class="preview-area" style="text-align:center">
      <canvas id="waveform" width="700" height="120" style="width:100%;height:120px;border-radius:8px;background:#1e293b"></canvas>
      <div id="timer" style="font-size:2.5em;font-weight:700;color:var(--primary);margin:15px 0">00:00</div>
      <div id="status" style="font-size:14px;color:var(--text-light);margin-bottom:15px">点击开始录音</div>
      <div class="btn-group">
        <button class="btn" id="recordBtn" onclick="toggleRecord()">🎙️ 开始录音</button>
        <button class="btn btn-outline" id="stopBtn" onclick="stopRecord()" disabled>⏹ 停止</button>
      </div>
      <div id="result" style="margin-top:20px;display:none">
        <audio id="audio" controls style="width:100%;margin-bottom:10px"></audio>
        <div class="btn-group">
          <button class="btn" onclick="downloadAudio()">下载录音</button>
        </div>
      </div>
    </div>
    <div class="ad-placeholder">广告位 - Google AdSense</div>
  </div>
  <footer class="footer">免费在线工具箱 © 2024</footer>
  <script src="../js/common.js"></script>
  <script>
  let mediaRecorder,chunks=[],stream,analyser,animFrame,startTime,timerInterval;
  const cv=document.getElementById('waveform'),ctx=cv.getContext('2d');

  async function toggleRecord(){
    if(mediaRecorder&&mediaRecorder.state==='recording'){
      mediaRecorder.pause();
      document.getElementById('recordBtn').textContent='▶ 继续';
      document.getElementById('status').textContent='已暂停';
      cancelAnimationFrame(animFrame);
      return;
    }
    if(mediaRecorder&&mediaRecorder.state==='paused'){
      mediaRecorder.resume();
      document.getElementById('recordBtn').textContent='⏸ 暂停';
      document.getElementById('status').textContent='录音中...';
      drawWaveform();
      return;
    }
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const audioCtx=new AudioContext();
      const source=audioCtx.createMediaStreamSource(stream);
      analyser=audioCtx.createAnalyser();
      analyser.fftSize=256;
      source.connect(analyser);

      mediaRecorder=new MediaRecorder(stream);
      chunks=[];
      mediaRecorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
      mediaRecorder.onstop=()=>{
        const blob=new Blob(chunks,{type:'audio/webm'});
        document.getElementById('audio').src=URL.createObjectURL(blob);
        document.getElementById('result').style.display='block';
        stream.getTracks().forEach(t=>t.stop());
      };
      mediaRecorder.start();
      startTime=Date.now();
      timerInterval=setInterval(updateTimer,1000);
      document.getElementById('recordBtn').textContent='⏸ 暂停';
      document.getElementById('stopBtn').disabled=false;
      document.getElementById('status').textContent='录音中...';
      document.getElementById('result').style.display='none';
      drawWaveform();
    }catch(e){
      showToast('无法访问麦克风，请允许权限');
    }
  }

  function stopRecord(){
    if(mediaRecorder&&mediaRecorder.state!=='inactive'){
      mediaRecorder.stop();
      cancelAnimationFrame(animFrame);
      clearInterval(timerInterval);
      document.getElementById('recordBtn').textContent='🎙️ 重新录音';
      document.getElementById('stopBtn').disabled=true;
      document.getElementById('status').textContent='录音完成';
      mediaRecorder=null;
    }
  }

  function updateTimer(){
    const elapsed=Math.floor((Date.now()-startTime)/1000);
    const m=Math.floor(elapsed/60),s=elapsed%60;
    document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }

  function drawWaveform(){
    const bufLen=analyser.frequencyBinCount;
    const data=new Uint8Array(bufLen);
    function draw(){
      animFrame=requestAnimationFrame(draw);
      analyser.getByteTimeDomainData(data);
      ctx.fillStyle='#1e293b';ctx.fillRect(0,0,cv.width,cv.height);
      ctx.lineWidth=2;ctx.strokeStyle='#6366f1';ctx.beginPath();
      const sliceW=cv.width/bufLen;
      let x=0;
      for(let i=0;i<bufLen;i++){
        const v=data[i]/128.0;const y=v*cv.height/2;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
        x+=sliceW;
      }
      ctx.lineTo(cv.width,cv.height/2);ctx.stroke();
    }
    draw();
  }

  function downloadAudio(){
    if(!chunks.length)return;
    const blob=new Blob(chunks,{type:'audio/webm'});
    downloadBlob(blob,'recording.webm');showToast('下载成功！');
  }
  </script>
</body>
</html>
