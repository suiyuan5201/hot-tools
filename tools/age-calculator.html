<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>年龄计算器 - 免费在线工具</title>
  <meta name="description" content="免费在线年龄计算器，精确计算年龄、已活天数、生肖、星座、距下次生日天数">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar"><a href="../tools.html" class="logo">🛠 在线工具箱</a><a href="../tools.html" class="nav-link">← 返回</a></nav>
  <div class="tool-page">
    <h1>🎂 年龄计算器</h1>
    <p class="subtitle">精确计算年龄、生肖、星座</p>
    <div class="preview-area">
      <label style="font-size:14px;display:block;text-align:center">出生日期：<input type="date" id="birth" class="input" style="width:200px;display:inline-block" onchange="calc()"></label>
    </div>
    <div id="result" style="display:none">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:20px 0" id="cards"></div>
      <div class="preview-area" id="detail"></div>
    </div>
    <div class="ad-placeholder">广告位 - Google AdSense</div>
  </div>
  <footer class="footer">免费在线工具箱 © 2024</footer>
  <script src="../js/common.js"></script>
  <script>
  function calc(){
    const birthStr=document.getElementById('birth').value;
    if(!birthStr)return;
    const birth=new Date(birthStr);
    const now=new Date();
    if(birth>now){showToast('出生日期不能是未来');return;}

    // 精确年龄
    let years=now.getFullYear()-birth.getFullYear();
    let months=now.getMonth()-birth.getMonth();
    let days=now.getDate()-birth.getDate();
    if(days<0){months--;const prev=new Date(now.getFullYear(),now.getMonth(),0);days+=prev.getDate();}
    if(months<0){years--;months+=12;}

    // 已活天数
    const totalDays=Math.floor((now-birth)/(1000*60*60*24));
    const totalHours=totalDays*24;

    // 下次生日
    let nextBirth=new Date(now.getFullYear(),birth.getMonth(),birth.getDate());
    if(nextBirth<=now)nextBirth=new Date(now.getFullYear()+1,birth.getMonth(),birth.getDate());
    const daysToNext=Math.ceil((nextBirth-now)/(1000*60*60*24));

    // 生肖
    const zodiacArr=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
    const zodiac=zodiacArr[(birth.getFullYear()-4)%12];

    // 星座
    const month=birth.getMonth()+1,day=birth.getDate();
    const constellations=[['摩羯座',1,20],['水瓶座',2,19],['双鱼座',3,20],['白羊座',4,20],['金牛座',5,21],['双子座',6,21],['巨蟹座',7,22],['狮子座',8,23],['处女座',9,23],['天秤座',10,23],['天蝎座',11,22],['射手座',12,22],['摩羯座',12,31]];
    let constellation='';
    for(let i=0;i<constellations.length-1;i++){
      const[name,m,d]=constellations[i];
      const[,nm,nd]=constellations[i+1];
      if((month===m&&day>=d+1)||(month===nm&&day<=nd)){constellation=constellations[i+1][0];break;}
    }
    if(!constellation)constellation='摩羯座';
    // 简单修正
    const cData=[[20,'水瓶座'],[19,'双鱼座'],[21,'白羊座'],[20,'金牛座'],[21,'双子座'],[22,'巨蟹座'],[23,'狮子座'],[23,'处女座'],[23,'天秤座'],[23,'天蝎座'],[22,'射手座'],[22,'摩羯座']];
    constellation=day>=cData[month-1][0]?cData[month-1][1]:cData[(month+10)%12][1];

    // 下一个整十岁
    const nextTen=Math.ceil((years+1)/10)*10;
    const nextTenDate=new Date(birth.getFullYear()+nextTen,birth.getMonth(),birth.getDate());

    const items=[
      {label:'周岁',value:`${years}岁`,color:'var(--primary)'},
      {label:'精确年龄',value:`${years}年${months}月${days}天`,color:'#8b5cf6'},
      {label:'已活天数',value:totalDays.toLocaleString()+'天',color:'#0ea5e9'},
      {label:'已活小时',value:totalHours.toLocaleString()+'时',color:'#14b8a6'},
      {label:'距下次生日',value:daysToNext+'天',color:'#f59e0b'},
      {label:'生肖',value:'属'+zodiac,color:'#ef4444'},
      {label:'星座',value:constellation,color:'#ec4899'},
      {label:'下个整十岁',value:`${nextTen}岁 (${nextTenDate.getFullYear()}年)`,color:'#10b981'},
    ];

    document.getElementById('cards').innerHTML=items.map(i=>`<div style="background:#fff;border-radius:12px;padding:15px;text-align:center;box-shadow:var(--shadow)"><div style="font-size:1.3em;font-weight:700;color:${i.color}">${i.value}</div><div style="font-size:12px;color:var(--text-light);margin-top:4px">${i.label}</div></div>`).join('');

    document.getElementById('detail').innerHTML=`<h3>详细信息</h3><div style="font-size:14px;line-height:2;margin-top:10px">
      <div>出生日期：${birth.toLocaleDateString()} 星期${'日一二三四五六'[birth.getDay()]}</div>
      <div>已经度过了 <b>${Math.floor(totalDays/365)}</b> 个完整年份</div>
      <div>已经度过了 <b>${Math.floor(totalDays/7)}</b> 个完整星期</div>
      <div>下次生日：${nextBirth.toLocaleDateString()} 星期${'日一二三四五六'[nextBirth.getDay()]}</div>
    </div>`;
    document.getElementById('result').style.display='block';
  }
  </script>
</body>
</html>
