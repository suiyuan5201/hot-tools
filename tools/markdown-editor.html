  <script>
  function parseMD(md){
    let html=md
      .replace(/^### (.+)$/gm,'<h3>$1</h3>')
      .replace(/^## (.+)$/gm,'<h2>$1</h2>')
      .replace(/^# (.+)$/gm,'<h1>$1</h1>')
      .replace(/^> (.+)$/gm,'<blockquote style="border-left:3px solid var(--primary);padding:8px 15px;margin:10px 0;background:#f8fafc;color:var(--text-light)">$1</blockquote>')
      .replace(/^---$/gm,'<hr style="border:none;border-top:1px solid var(--border);margin:15px 0">')
      .replace(/^- (.+)$/gm,'<li>$1</li>')
      .replace(/(<li>.*<\/li>\n?)+/g,'<ul style="padding-left:20px;margin:8px 0">$&</ul>')
      .replace(/\!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1" style="max-width:100%;border-radius:6px">')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" style="color:var(--primary)" target="_blank">$1</a>')
      .replace(/```([\s\S]*?)```/g,'<pre style="background:#1e293b;color:#e2e8f0;padding:15px;border-radius:8px;overflow-x:auto;font-size:13px"><code>$1</code></pre>')
      .replace(/`([^`]+)`/g,'<code style="background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:13px;color:#e11d48">$1</code>')
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g,'<em>$1</em>');
    // 简单表格
    html=html.replace(/(\|.+\|\n)+/g,m=>{
      const rows=m.trim().split('\n').filter(r=>!/^\|[\s-|]+\|$/.test(r));
      if(rows.length<1)return m;
      const hdr=rows[0].split('|').filter(c=>c.trim());
      const body=rows.slice(1);
      let t='<table style="width:100%;border-collapse:collapse;margin:10px 0"><thead><tr>';
      hdr.forEach(c=>t+=`<th style="border:1px solid var(--border);padding:8px;background:var(--bg);font-size:13px">${c.trim()}</th>`);
      t+='</tr></thead><tbody>';
      body.forEach(r=>{t+='<tr>';r.split('|').filter(c=>c.trim()).forEach(c=>t+=`<td style="border:1px solid var(--border);padding:8px;font-size:13px">${c.trim()}</td>`);t+='</tr>';});
      return t+'</tbody></table>';
    });
    // 段落
    html=html.replace(/^(?!<[hupltbao]|<\/|<br|<hr|<img|<pre|<code|<strong|<em|<ul|<li|<blockquote|<table)(.+)$/gm,'<p style="margin:8px 0">$1</p>');
    return html;
  }
  function render(){document.getElementById('preview').innerHTML=parseMD(document.getElementById('md').value);}
  function ins(before,after){
    const ta=document.getElementById('md'),s=ta.selectionStart,e=ta.selectionEnd;
    const sel=ta.value.substring(s,e)||'文本';
    ta.value=ta.value.substring(0,s)+before+sel+after+ta.value.substring(e);
    ta.focus();ta.selectionStart=s+before.length;ta.selectionEnd=s+before.length+sel.length;
    render();
  }
  function exportHTML(){
    const html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Markdown导出</title></head><body style="max-width:800px;margin:40px auto;padding:0 20px;font-family:sans-serif;line-height:1.8">'+parseMD(document.getElementById('md').value)+'</body></html>';
    const blob=new Blob([html],{type:'text/html'});downloadBlob(blob,'markdown.html');showToast('导出成功！');
  }
  render();
  </script>
