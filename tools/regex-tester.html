<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>正则表达式测试 - 免费在线工具</title>
  <meta name="description" content="免费在线正则表达式测试工具，实时高亮匹配结果，提供常用正则模板">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar"><a href="../tools.html" class="logo">🛠 在线工具箱</a><a href="../tools.html" class="nav-link">← 返回</a></nav>
  <div class="tool-page">
    <h1>🔣 正则表达式测试</h1>
    <p class="subtitle">实时高亮匹配，常用模板一键使用</p>
    <div class="preview-area">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
        <span style="font-size:20px;color:var(--text-light)">/</span>
        <input type="text" id="regex" class="input" style="flex:1;font-family:monospace" placeholder="输入正则表达式" oninput="test()">
        <span style="font-size:20px;color:var(--text-light)">/</span>
        <input type="text" id="flags" class="input" style="width:60px;font-family:monospace" value="g" oninput="test()">
      </div>
      <textarea class="input" id="txt" rows="6" placeholder="输入测试文本..." oninput="test()" style="font-family:monospace;font-size:14px">Hello World! 我的邮箱是test@example.com，手机号13800138000，另一个邮箱admin@test.cn</textarea>
    </div>
    <div style="font-size:13px;margin:10px 0;color:var(--text-light)">常用模板：</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:15px">
      <button class="btn btn-sm btn-outline" onclick="setR('[\\w.-]+@[\\w.-]+\\.\\w+','g')">邮箱</button>
      <button class="btn btn-sm btn-outline" onclick="setR('1[3-9]\\d{9}','g')">手机号</button>
      <button class="btn btn-sm btn-outline" onclick="setR('\\d{17}[\\dXx]','g')">身份证</button>
      <button class="btn btn-sm btn-outline" onclick="setR('https?://[\\w./\\-?=&#%]+','g')">URL</button>
      <button class="btn btn-sm btn-outline" onclick="setR('\\d{1,3}(\\.\\d{1,3}){3}','g')">IP地址</button>
      <button class="btn btn-sm btn-outline" onclick="setR('[\\u4e00-\\u9fff]+','g')">中文</button>
      <button class="btn btn-sm btn-outline" onclick="setR('\\d+','g')">数字</button>
      <button class="btn btn-sm btn-outline" onclick="setR('#[0-9a-fA-F]{3,8}','g')">颜色值</button>
    </div>
    <div id="matchInfo" style="margin-bottom:10px"></div>
    <div class="preview-area" id="result" style="font-family:monospace;font-size:14px;line-height:2;word-break:break-all"></div>
    <div id="matchList" style="margin-top:15px"></div>
    <div class="ad-placeholder">广告位 - Google AdSense</div>
  </div>
  <footer class="footer">免费在线工具箱 © 2024</footer>
  <script src="../js/common.js"></script>
  <script>
  function setR(r,f){document.getElementById('regex').value=r;document.getElementById('flags').value=f;test();}
  function test(){
    const pattern=document.getElementById('regex').value;
    const flags=document.getElementById('flags').value;
    const text=document.getElementById('txt').value;
    const resultEl=document.getElementById('result');
    const infoEl=document.getElementById('matchInfo');
    const listEl=document.getElementById('matchList');
    if(!pattern){resultEl.innerHTML=esc(text);infoEl.innerHTML='';listEl.innerHTML='';return;}
    try{
      const re=new RegExp(pattern,flags);
      const matches=[...text.matchAll(new RegExp(pattern,flags.includes('g')?flags:flags+'g'))];
      infoEl.innerHTML=`<span class="info-item">匹配 ${matches.length} 处</span>`;
      // 高亮
      let html='',lastIdx=0;
      const reG=new RegExp(pattern,flags.includes('g')?flags:flags+'g');
      let m;
      while((m=reG.exec(text))!==null){
        html+=esc(text.slice(lastIdx,m.index));
        html+=`<mark style="background:#a5b4fc;color:#1e293b;padding:1px 3px;border-radius:3px">${esc(m[0])}</mark>`;
        lastIdx=m.index+m[0].length;
        if(!m[0].length)reG.lastIndex++;
      }
      html+=esc(text.slice(lastIdx));
      resultEl.innerHTML=html;
      // 匹配列表
      if(matches.length>0&&matches.length<=50){
        listEl.innerHTML='<div style="font-size:13px;color:var(--text-light);margin-bottom:8px">匹配详情：</div>'+matches.map((m,i)=>`<div style="font-size:12px;padding:4px 8px;background:#f8fafc;border-radius:6px;margin-bottom:4px;display:flex;gap:10px"><span style="color:var(--primary);font-weight:600">#${i+1}</span><span style="color:var(--text-light)">位置${m.index}</span><code>${esc(m[0])}</code></div>`).join('');
      }else{listEl.innerHTML='';}
    }catch(e){
      resultEl.innerHTML=`<span style="color:#ef4444">正则语法错误: ${e.message}</span>`;
      infoEl.innerHTML='';listEl.innerHTML='';
    }
  }
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  test();
  </script>
</body>
</html>
