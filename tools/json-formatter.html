<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>JSON格式化 - 免费在线工具</title>
  <meta name="description" content="免费在线JSON格式化工具，JSON美化、压缩、语法校验，支持语法高亮显示">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar"><a href="../tools.html" class="logo">🛠 在线工具箱</a><a href="../tools.html" class="nav-link">← 返回</a></nav>
  <div class="tool-page">
    <h1>{ } JSON格式化</h1>
    <p class="subtitle">JSON美化、压缩、语法校验</p>
    <textarea class="input" id="jsonIn" rows="10" placeholder='粘贴JSON字符串，如: {"name":"test","age":18}' style="font-family:monospace;font-size:13px"></textarea>
    <div class="btn-group">
      <button class="btn" onclick="fmt(2)">格式化(2空格)</button>
      <button class="btn btn-outline" onclick="fmt(4)">格式化(4空格)</button>
      <button class="btn btn-outline" onclick="compress()">压缩</button>
      <button class="btn btn-outline" onclick="copyToClipboard(document.getElementById('jsonOut').textContent)">复制结果</button>
    </div>
    <div id="error" style="color:#ef4444;font-size:13px;text-align:center;margin:5px 0"></div>
    <div class="preview-area"><pre id="jsonOut" style="font-size:13px;line-height:1.6;overflow-x:auto;white-space:pre-wrap;word-break:break-all"></pre></div>
    <div class="ad-placeholder">广告位 - Google AdSense</div>
  </div>
  <footer class="footer">免费在线工具箱 © 2024</footer>
  <script src="../js/common.js"></script>
  <script>
  function fmt(indent){
    const err=document.getElementById('error');err.textContent='';
    try{
      const obj=JSON.parse(document.getElementById('jsonIn').value);
      const str=JSON.stringify(obj,null,indent);
      document.getElementById('jsonOut').innerHTML=highlight(str);
    }catch(e){err.textContent='JSON语法错误: '+e.message;}
  }
  function compress(){
    const err=document.getElementById('error');err.textContent='';
    try{
      const obj=JSON.parse(document.getElementById('jsonIn').value);
      const str=JSON.stringify(obj);
      document.getElementById('jsonOut').textContent=str;
    }catch(e){err.textContent='JSON语法错误: '+e.message;}
  }
  function highlight(json){
    return json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"([^"]+)"(?=\s*:)/g,'<span style="color:#6366f1">"$1"</span>')
      .replace(/"([^"]*)"/g,'<span style="color:#10b981">"$1"</span>')
      .replace(/\b(\d+\.?\d*)\b/g,'<span style="color:#f59e0b">$1</span>')
      .replace(/\b(true|false)\b/g,'<span style="color:#ec4899">$1</span>')
      .replace(/\bnull\b/g,'<span style="color:#64748b">null</span>');
  }
  </script>
</body>
</html>
