<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>在线白板 - 免费在线工具</title>
  <meta name="description" content="免费在线白板画板，支持画笔、橡皮擦、形状、文字工具，撤销重做，下载PNG">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2030154790924322" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar"><a href="../tools.html" class="logo">🛠 在线工具箱</a><a href="../tools.html" class="nav-link">← 返回</a></nav>
  <div class="tool-page" style="max-width:1000px">
    <h1>🎨 在线白板</h1>
    <p class="subtitle">自由画板，支持画笔、形状、文字</p>
    <div class="preview-area" style="padding:10px">
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
        <button class="btn btn-sm active" id="tool_pen" onclick="setTool('pen')">✏️ 画笔</button>
        <button class="btn btn-sm btn-outline" id="tool_eraser" onclick="setTool('eraser')">🧽 橡皮</button>
        <button class="btn btn-sm btn-outline" id="tool_rect" onclick="setTool('rect')">⬜ 矩形</button>
        <button class="btn btn-sm btn-outline" id="tool_circle" onclick="setTool('circle')">⭕ 圆形</button>
        <button class="btn btn-sm btn-outline" id="tool_line" onclick="setTool('line')">📏 直线</button>
        <span style="margin-left:auto"></span>
        <input type="color" id="color" value="#1e293b" style="width:32px;height:32px;border:none;cursor:pointer;border-radius:4px">
        <input type="range" id="lineWidth" min="1" max="30" value="3" style="width:80px;accent-color:var(--primary)" title="粗细">
        <button class="btn btn-sm btn-outline" onclick="undo()">↩ 撤销</button>
        <button class="btn btn-sm btn-outline" onclick="redo()">↪ 重做</button>
        <button class="btn btn-sm btn-outline" onclick="clearCanvas()">🗑️ 清空</button>
        <button class="btn btn-sm" onclick="download()">💾 下载</button>
      </div>
      <canvas id="cv" style="width:100%;border:1px solid var(--border);border-radius:8px;cursor:crosshair;background:#fff;touch-action:none"></canvas>
    </div>
    <div class="ad-placeholder">广告位 - Google AdSense</div>
  </div>
  <footer class="footer">免费在线工具箱 © 2024</footer>
  <script src="../js/common.js"></script>
  <script>
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  let tool='pen',drawing=false,startX,startY,history=[],historyIdx=-1,snapshot;

  function resize(){cv.width=cv.offsetWidth;cv.height=Math.max(500,window.innerHeight-300);redraw();}
  window.addEventListener('resize',resize);resize();

  function setTool(t){
    tool=t;
    ['pen','eraser','rect','circle','line'].forEach(n=>{
      document.getElementById('tool_'+n).className='btn btn-sm '+(n===t?'active':'btn-outline');
    });
    cv.style.cursor=t==='eraser'?'cell':'crosshair';
  }

  function saveState(){
    history=history.slice(0,historyIdx+1);
    history.push(cv.toDataURL());
    historyIdx=history.length-1;
    if(history.length>50){history.shift();historyIdx--;}
  }

  function undo(){if(historyIdx>0){historyIdx--;redraw();}}
  function redo(){if(historyIdx<history.length-1){historyIdx++;redraw();}}

  function redraw(){
    if(historyIdx<0){ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);return;}
    const img=new Image();img.onload=()=>{ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0);};
    img.src=history[historyIdx];
  }

  function clearCanvas(){ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);saveState();}

  function getPos(e){
    const r=cv.getBoundingClientRect();
    const touch=e.touches?e.touches[0]:e;
    return{x:touch.clientX-r.left,y:touch.clientY-r.top};
  }

  function onStart(e){
    e.preventDefault();drawing=true;
    const p=getPos(e);startX=p.x;startY=p.y;
    snapshot=ctx.getImageData(0,0,cv.width,cv.height);
    if(tool==='pen'||tool==='eraser'){
      ctx.beginPath();ctx.moveTo(p.x,p.y);
      ctx.strokeStyle=tool==='eraser'?'#ffffff':document.getElementById('color').value;
      ctx.lineWidth=tool==='eraser'?+document.getElementById('lineWidth').value*3:+document.getElementById('lineWidth').value;
      ctx.lineCap='round';ctx.lineJoin='round';
    }
  }

  function onMove(e){
    if(!drawing)return;e.preventDefault();
    const p=getPos(e);
    if(tool==='pen'||tool==='eraser'){
      ctx.lineTo(p.x,p.y);ctx.stroke();
    }else{
      ctx.putImageData(snapshot,0,0);
      ctx.strokeStyle=document.getElementById('color').value;
      ctx.lineWidth=+document.getElementById('lineWidth').value;
      ctx.lineCap='round';
      if(tool==='rect'){ctx.strokeRect(startX,startY,p.x-startX,p.y-startY);}
      else if(tool==='circle'){
        const rx=Math.abs(p.x-startX)/2,ry=Math.abs(p.y-startY)/2;
        const cx=startX+(p.x-startX)/2,cy=startY+(p.y-startY)/2;
        ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.stroke();
      }else if(tool==='line'){
        ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(p.x,p.y);ctx.stroke();
      }
    }
  }

  function onEnd(e){
    if(!drawing)return;drawing=false;
    saveState();
  }

  cv.addEventListener('mousedown',onStart);
  cv.addEventListener('mousemove',onMove);
  cv.addEventListener('mouseup',onEnd);
  cv.addEventListener('mouseleave',onEnd);
  cv.addEventListener('touchstart',onStart,{passive:false});
  cv.addEventListener('touchmove',onMove,{passive:false});
  cv.addEventListener('touchend',onEnd);

  function download(){cv.toBlob(b=>downloadBlob(b,'whiteboard.png'),'image/png');showToast('下载成功！');}

  // 初始化白色背景
  ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);saveState();
  </script>
</body>
</html>
