<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>密码生成器 - 免费在线工具</title>
  <meta name="description" content="免费在线密码生成器，随机生成安全密码，支持自定义长度和字符类型，密码强度评估">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2030154790924322" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar"><a href="../tools.html" class="logo">🛠 在线工具箱</a><a href="../tools.html" class="nav-link">← 返回</a></nav>
  <div class="tool-page">
    <h1>🔐 密码生成器</h1>
    <p class="subtitle">随机生成安全密码，强度评估</p>
    <div class="preview-area">
      <div style="background:#1e293b;border-radius:10px;padding:20px;text-align:center;margin-bottom:20px">
        <div id="pwd" style="font-family:monospace;font-size:24px;color:#a5b4fc;word-break:break-all;letter-spacing:2px">点击生成</div>
      </div>
      <div id="strength" style="margin-bottom:15px"></div>
      <div class="slider-row"><label>长度:</label><input type="range" id="len" min="6" max="64" value="16" oninput="document.getElementById('lenV').textContent=this.value"><span id="lenV">16</span></div>
      <div style="display:flex;gap:15px;flex-wrap:wrap;margin:15px 0;font-size:14px">
        <label><input type="checkbox" id="upper" checked> 大写字母(A-Z)</label>
        <label><input type="checkbox" id="lower" checked> 小写字母(a-z)</label>
        <label><input type="checkbox" id="digit" checked> 数字(0-9)</label>
        <label><input type="checkbox" id="symbol" checked> 特殊字符(!@#$)</label>
      </div>
      <div class="btn-group">
        <button class="btn" onclick="gen()">🎲 生成密码</button>
        <button class="btn btn-outline" onclick="copyToClipboard(document.getElementById('pwd').textContent)">复制</button>
        <button class="btn btn-outline" onclick="genBatch()">批量生成5个</button>
      </div>
      <div id="batch" style="margin-top:15px"></div>
    </div>
    <div class="ad-placeholder">广告位 - Google AdSense</div>
  </div>
  <footer class="footer">免费在线工具箱 © 2024</footer>
  <script src="../js/common.js"></script>
  <script>
  function gen(){
    let chars='';
    if(document.getElementById('upper').checked)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    if(document.getElementById('lower').checked)chars+='abcdefghijklmnopqrstuvwxyz';
    if(document.getElementById('digit').checked)chars+='0123456789';
    if(document.getElementById('symbol').checked)chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
    if(!chars){showToast('请至少选一种字符');return '';}
    const len=+document.getElementById('len').value;
    const arr=new Uint32Array(len);crypto.getRandomValues(arr);
    const pwd=[...arr].map(v=>chars[v%chars.length]).join('');
    document.getElementById('pwd').textContent=pwd;
    evalStrength(pwd);
    return pwd;
  }
  function evalStrength(pwd){
    let score=0;
    if(pwd.length>=8)score++;if(pwd.length>=12)score++;if(pwd.length>=20)score++;
    if(/[A-Z]/.test(pwd))score++;if(/[a-z]/.test(pwd))score++;
    if(/\d/.test(pwd))score++;if(/[^A-Za-z0-9]/.test(pwd))score++;
    const levels=[{t:'极弱',c:'#ef4444',w:15},{t:'弱',c:'#f97316',w:30},{t:'一般',c:'#eab308',w:50},{t:'强',c:'#22c55e',w:75},{t:'很强',c:'#10b981',w:90},{t:'极强',c:'#6366f1',w:100}];
    const idx=Math.min(score,levels.length-1);
    const l=levels[idx];
    document.getElementById('strength').innerHTML=`<div style="display:flex;align-items:center;gap:10px"><span style="font-size:13px;color:${l.c};font-weight:600">${l.t}</span><div style="flex:1;height:6px;background:#f1f5f9;border-radius:3px;overflow:hidden"><div style="width:${l.w}%;height:100%;background:${l.c};border-radius:3px;transition:width .3s"></div></div></div>`;
  }
  function genBatch(){
    const results=[];for(let i=0;i<5;i++){
      const p=gen();if(p)results.push(p);
    }
    document.getElementById('batch').innerHTML=results.map(p=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)"><code style="flex:1;font-size:13px;word-break:break-all">${p}</code><button class="btn btn-sm btn-outline" onclick="copyToClipboard('${p}')">复制</button></div>`).join('');
  }
  gen();
  </script>
</body>
</html>
