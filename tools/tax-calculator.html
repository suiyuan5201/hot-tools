<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>个税计算器 - 免费在线工具</title>
  <meta name="description" content="免费在线个税计算器，2024最新税率表，计算应纳税额和到手工资">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar"><a href="../tools.html" class="logo">🛠 在线工具箱</a><a href="../tools.html" class="nav-link">← 返回</a></nav>
  <div class="tool-page">
    <h1>💰 个税计算器</h1>
    <p class="subtitle">2024最新税率表，到手工资一目了然</p>
    <div class="preview-area">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px">
        <label>税前月薪(元)：<input type="number" id="salary" class="input" value="15000" oninput="calc()"></label>
        <label>五险一金(元)：<input type="number" id="insurance" class="input" value="2000" oninput="calc()"></label>
        <label>专项附加扣除(元)：<input type="number" id="special" class="input" value="1500" oninput="calc()"></label>
        <label>起征点(元)：<input type="number" id="threshold" class="input" value="5000" readonly></label>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:15px;margin:20px 0" id="result"></div>
    <div class="preview-area">
      <h3>个人所得税税率表（综合所得）</h3>
      <div style="overflow-x:auto;margin-top:10px">
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <tr style="background:var(--bg)"><th style="padding:8px;border:1px solid var(--border)">级数</th><th style="padding:8px;border:1px solid var(--border)">应纳税所得额(月)</th><th style="padding:8px;border:1px solid var(--border)">税率</th><th style="padding:8px;border:1px solid var(--border)">速算扣除数</th></tr>
          <tr><td style="padding:8px;border:1px solid var(--border);text-align:center">1</td><td style="padding:8px;border:1px solid var(--border)">≤3000元</td><td style="padding:8px;border:1px solid var(--border)">3%</td><td style="padding:8px;border:1px solid var(--border)">0</td></tr>
          <tr><td style="padding:8px;border:1px solid var(--border);text-align:center">2</td><td style="padding:8px;border:1px solid var(--border)">3000-12000元</td><td style="padding:8px;border:1px solid var(--border)">10%</td><td style="padding:8px;border:1px solid var(--border)">210</td></tr>
          <tr><td style="padding:8px;border:1px solid var(--border);text-align:center">3</td><td style="padding:8px;border:1px solid var(--border)">12000-25000元</td><td style="padding:8px;border:1px solid var(--border)">20%</td><td style="padding:8px;border:1px solid var(--border)">1410</td></tr>
          <tr><td style="padding:8px;border:1px solid var(--border);text-align:center">4</td><td style="padding:8px;border:1px solid var(--border)">25000-35000元</td><td style="padding:8px;border:1px solid var(--border)">25%</td><td style="padding:8px;border:1px solid var(--border)">2660</td></tr>
          <tr><td style="padding:8px;border:1px solid var(--border);text-align:center">5</td><td style="padding:8px;border:1px solid var(--border)">35000-55000元</td><td style="padding:8px;border:1px solid var(--border)">30%</td><td style="padding:8px;border:1px solid var(--border)">4410</td></tr>
          <tr><td style="padding:8px;border:1px solid var(--border);text-align:center">6</td><td style="padding:8px;border:1px solid var(--border)">55000-80000元</td><td style="padding:8px;border:1px solid var(--border)">35%</td><td style="padding:8px;border:1px solid var(--border)">7160</td></tr>
          <tr><td style="padding:8px;border:1px solid var(--border);text-align:center">7</td><td style="padding:8px;border:1px solid var(--border)">＞80000元</td><td style="padding:8px;border:1px solid var(--border)">45%</td><td style="padding:8px;border:1px solid var(--border)">15160</td></tr>
        </table>
      </div>
    </div>
    <div class="ad-placeholder">广告位 - Google AdSense</div>
  </div>
  <footer class="footer">免费在线工具箱 © 2024</footer>
  <script src="../js/common.js"></script>
  <script>
  const BRACKETS=[[3000,.03,0],[12000,.10,210],[25000,.20,1410],[35000,.25,2660],[55000,.30,4410],[80000,.35,7160],[Infinity,.45,15160]];
  function calc(){
    const salary=+document.getElementById('salary').value;
    const insurance=+document.getElementById('insurance').value;
    const special=+document.getElementById('special').value;
    const threshold=+document.getElementById('threshold').value;
    const taxable=Math.max(0,salary-insurance-special-threshold);
    let tax=0,rate=0,deduction=0;
    for(const [limit,r,d] of BRACKETS){
      if(taxable<=limit){tax=taxable*r-d;rate=r*100;deduction=d;break;}
    }
    tax=Math.max(0,tax);
    const afterTax=salary-insurance-tax;

    document.getElementById('result').innerHTML=`
      <div style="background:#fff;border-radius:12px;padding:18px;text-align:center;box-shadow:var(--shadow)"><div style="font-size:1.8em;font-weight:700;color:var(--primary)">${afterTax.toFixed(2)}</div><div style="font-size:12px;color:var(--text-light);margin-top:4px">到手工资(元)</div></div>
      <div style="background:#fff;border-radius:12px;padding:18px;text-align:center;box-shadow:var(--shadow)"><div style="font-size:1.8em;font-weight:700;color:#ef4444">${tax.toFixed(2)}</div><div style="font-size:12px;color:var(--text-light);margin-top:4px">应缴个税(元)</div></div>
      <div style="background:#fff;border-radius:12px;padding:18px;text-align:center;box-shadow:var(--shadow)"><div style="font-size:1.8em;font-weight:700;color:#f59e0b">${taxable.toFixed(2)}</div><div style="font-size:12px;color:var(--text-light);margin-top:4px">应纳税所得额(元)</div></div>
      <div style="background:#fff;border-radius:12px;padding:18px;text-align:center;box-shadow:var(--shadow)"><div style="font-size:1.8em;font-weight:700;color:#10b981">${rate}%</div><div style="font-size:12px;color:var(--text-light);margin-top:4px">适用税率</div></div>
      <div style="background:#fff;border-radius:12px;padding:18px;text-align:center;box-shadow:var(--shadow)"><div style="font-size:1.8em;font-weight:700;color:#6366f1">${(afterTax*12/10000).toFixed(2)}</div><div style="font-size:12px;color:var(--text-light);margin-top:4px">年到手(万元)</div></div>
      <div style="background:#fff;border-radius:12px;padding:18px;text-align:center;box-shadow:var(--shadow)"><div style="font-size:1.8em;font-weight:700;color:#8b5cf6">${(tax*12).toFixed(2)}</div><div style="font-size:12px;color:var(--text-light);margin-top:4px">年缴个税(元)</div></div>
    `;
  }
  calc();
  </script>
</body>
</html>
