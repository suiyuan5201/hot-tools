<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>记账本 - 免费在线工具</title>
  <meta name="description" content="免费在线记账本，记录收入支出，分类统计，图表展示，数据保存在浏览器本地">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar"><a href="../tools.html" class="logo">🛠 在线工具箱</a><a href="../tools.html" class="nav-link">← 返回</a></nav>
  <div class="tool-page">
    <h1>📒 记账本</h1>
    <p class="subtitle">记录收支，分类统计，数据本地保存</p>
    <div class="preview-area">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;font-size:14px">
        <label>类型：<select id="type" class="option-select" style="width:100%"><option value="expense">支出</option><option value="income">收入</option></select></label>
        <label>金额：<input type="number" id="amount" class="input" placeholder="0.00" step="0.01"></label>
        <label>类别：<select id="cat" class="option-select" style="width:100%"><option>餐饮</option><option>交通</option><option>购物</option><option>娱乐</option><option>住房</option><option>工资</option><option>其他</option></select></label>
      </div>
      <div style="display:flex;gap:10px;margin-top:10px;font-size:14px">
        <label style="flex:1">备注：<input type="text" id="note" class="input" placeholder="可选"></label>
        <label>日期：<input type="date" id="date" class="input" style="width:160px"></label>
      </div>
      <div class="btn-group"><button class="btn" onclick="addRecord()">添加记录</button></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0" id="summary"></div>
    <div class="preview-area"><h3>记录列表</h3><div id="list" style="margin-top:10px"></div></div>
    <div class="ad-placeholder">广告位 - Google AdSense</div>
  </div>
  <footer class="footer">免费在线工具箱 © 2024</footer>
  <script src="../js/common.js"></script>
  <script>
  document.getElementById('date').value=new Date().toISOString().slice(0,10);
  let records=JSON.parse(localStorage.getItem('expense_records')||'[]');

  function save(){localStorage.setItem('expense_records',JSON.stringify(records));}

  function addRecord(){
    const amount=+document.getElementById('amount').value;
    if(!amount){showToast('请输入金额');return;}
    records.unshift({
      id:Date.now(),
      type:document.getElementById('type').value,
      amount,
      cat:document.getElementById('cat').value,
      note:document.getElementById('note').value,
      date:document.getElementById('date').value
    });
    save();render();
    document.getElementById('amount').value='';
    document.getElementById('note').value='';
    showToast('添加成功！');
  }

  function deleteRecord(id){
    records=records.filter(r=>r.id!==id);save();render();
  }

  function render(){
    const thisMonth=new Date().toISOString().slice(0,7);
    const monthRecords=records.filter(r=>r.date.startsWith(thisMonth));
    const totalIncome=monthRecords.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);
    const totalExpense=monthRecords.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);

    document.getElementById('summary').innerHTML=`
      <div style="background:#fff;border-radius:12px;padding:15px;text-align:center;box-shadow:var(--shadow)"><div style="font-size:1.5em;font-weight:700;color:#10b981">+${totalIncome.toFixed(2)}</div><div style="font-size:12px;color:var(--text-light);margin-top:4px">本月收入</div></div>
      <div style="background:#fff;border-radius:12px;padding:15px;text-align:center;box-shadow:var(--shadow)"><div style="font-size:1.5em;font-weight:700;color:#ef4444">-${totalExpense.toFixed(2)}</div><div style="font-size:12px;color:var(--text-light);margin-top:4px">本月支出</div></div>
      <div style="background:#fff;border-radius:12px;padding:15px;text-align:center;box-shadow:var(--shadow)"><div style="font-size:1.5em;font-weight:700;color:var(--primary)">${(totalIncome-totalExpense).toFixed(2)}</div><div style="font-size:12px;color:var(--text-light);margin-top:4px">本月结余</div></div>
    `;

    const list=document.getElementById('list');
    if(!records.length){list.innerHTML='<p style="text-align:center;color:var(--text-light);padding:20px">暂无记录</p>';return;}
    list.innerHTML=records.slice(0,50).map(r=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px">
      <span style="width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;background:${r.type==='income'?'#dcfce7':'#fee2e2'};color:${r.type==='income'?'#16a34a':'#dc2626'}">${r.type==='income'?'+':'-'}</span>
      <span style="font-weight:600;min-width:60px">${r.type==='income'?'+':'-'}${r.amount.toFixed(2)}</span>
      <span style="background:var(--bg);padding:2px 8px;border-radius:10px;font-size:12px">${r.cat}</span>
      <span style="flex:1;color:var(--text-light);font-size:13px">${r.note||''}</span>
      <span style="color:var(--text-light);font-size:12px">${r.date}</span>
      <button onclick="deleteRecord(${r.id})" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:16px">×</button>
    </div>`).join('');
  }
  render();
  </script>
</body>
</html>
