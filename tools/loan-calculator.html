<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>房贷计算器 - 免费在线工具</title>
  <meta name="description" content="免费在线房贷计算器，支持等额本息和等额本金两种还款方式，计算月供、总利息">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar"><a href="../tools.html" class="logo">🛠 在线工具箱</a><a href="../tools.html" class="nav-link">← 返回</a></nav>
  <div class="tool-page">
    <h1>🏠 房贷计算器</h1>
    <p class="subtitle">等额本息 / 等额本金，月供利息一目了然</p>
    <div class="preview-area">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px">
        <label>贷款金额(万元)：<input type="number" id="amount" class="input" value="100"></label>
        <label>贷款年限(年)：<input type="number" id="years" class="input" value="30"></label>
        <label>年利率(%)：<input type="number" id="rate" class="input" value="3.85" step="0.01"></label>
        <label>还款方式：<select id="method" class="option-select" style="width:100%"><option value="equal">等额本息</option><option value="principal">等额本金</option></select></label>
      </div>
      <div class="btn-group"><button class="btn" onclick="calc()">开始计算</button></div>
    </div>
    <div id="result" style="display:none">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px;margin:20px 0" id="summary"></div>
      <div class="preview-area"><h3>还款明细（前12个月）</h3>
        <div style="overflow-x:auto;margin-top:10px"><table style="width:100%;border-collapse:collapse;font-size:13px" id="table"></table></div>
      </div>
    </div>
    <div class="ad-placeholder">广告位 - Google AdSense</div>
  </div>
  <footer class="footer">免费在线工具箱 © 2024</footer>
  <script src="../js/common.js"></script>
  <script>
  function calc(){
    const amount=+document.getElementById('amount').value*10000;
    const years=+document.getElementById('years').value;
    const rate=+document.getElementById('rate').value/100;
    const method=document.getElementById('method').value;
    const months=years*12;
    const monthRate=rate/12;

    let monthlyFirst,totalInterest,totalPayment;
    const details=[];

    if(method==='equal'){
      // 等额本息
      const monthly=amount*monthRate*Math.pow(1+monthRate,months)/(Math.pow(1+monthRate,months)-1);
      monthlyFirst=monthly;
      totalPayment=monthly*months;
      totalInterest=totalPayment-amount;
      let remaining=amount;
      for(let i=1;i<=Math.min(12,months);i++){
        const interest=remaining*monthRate;
        const principal=monthly-interest;
        remaining-=principal;
        details.push({month:i,payment:monthly,principal,interest,remaining:Math.max(0,remaining)});
      }
    }else{
      // 等额本金
      const monthPrincipal=amount/months;
      monthlyFirst=monthPrincipal+amount*monthRate;
      totalInterest=0;
      let remaining=amount;
      for(let i=1;i<=months;i++){
        const interest=remaining*monthRate;
        const payment=monthPrincipal+interest;
        totalInterest+=interest;
        remaining-=monthPrincipal;
        if(i<=12)details.push({month:i,payment,principal:monthPrincipal,interest,remaining:Math.max(0,remaining)});
      }
      totalPayment=amount+totalInterest;
    }

    document.getElementById('summary').innerHTML=`
      <div style="background:#fff;border-radius:12px;padding:18px;text-align:center;box-shadow:var(--shadow)"><div style="font-size:1.8em;font-weight:700;color:var(--primary)">${(monthlyFirst).toFixed(2)}</div><div style="font-size:12px;color:var(--text-light);margin-top:4px">${method==='equal'?'每月月供':'首月月供'}(元)</div></div>
      <div style="background:#fff;border-radius:12px;padding:18px;text-align:center;box-shadow:var(--shadow)"><div style="font-size:1.8em;font-weight:700;color:#f59e0b">${(totalInterest/10000).toFixed(2)}</div><div style="font-size:12px;color:var(--text-light);margin-top:4px">总利息(万元)</div></div>
      <div style="background:#fff;border-radius:12px;padding:18px;text-align:center;box-shadow:var(--shadow)"><div style="font-size:1.8em;font-weight:700;color:#10b981">${(totalPayment/10000).toFixed(2)}</div><div style="font-size:12px;color:var(--text-light);margin-top:4px">总还款额(万元)</div></div>
    `;

    const thStyle='padding:8px;border-bottom:2px solid var(--border);text-align:right;font-weight:600;background:var(--bg)';
    const tdStyle='padding:8px;border-bottom:1px solid var(--border);text-align:right;font-size:13px';
    document.getElementById('table').innerHTML=`<tr><th style="${thStyle}">期数</th><th style="${thStyle}">月供(元)</th><th style="${thStyle}">本金(元)</th><th style="${thStyle}">利息(元)</th><th style="${thStyle}">剩余本金(元)</th></tr>`+
      details.map(d=>`<tr><td style="${tdStyle}">${d.month}</td><td style="${tdStyle}">${d.payment.toFixed(2)}</td><td style="${tdStyle}">${d.principal.toFixed(2)}</td><td style="${tdStyle}">${d.interest.toFixed(2)}</td><td style="${tdStyle}">${d.remaining.toFixed(2)}</td></tr>`).join('');
    document.getElementById('result').style.display='block';
  }
  </script>
</body>
</html>
