<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>图片滤镜 - 免费在线工具</title>
  <meta name="description" content="免费在线图片滤镜工具，10+滤镜预设，黑白、复古、暖色、冷色等一键美化">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar"><a href="../tools.html" class="logo">🛠 在线工具箱</a><a href="../tools.html" class="nav-link">← 返回</a></nav>
  <div class="tool-page">
    <h1>🎨 图片滤镜</h1>
    <p class="subtitle">10+ 滤镜预设，一键美化图片</p>
    <div class="upload-area" onclick="document.getElementById('fi').click()">
      <div class="icon">📁</div><p>点击上传图片</p>
      <input type="file" id="fi" accept="image/*">
    </div>
    <div id="editor" style="display:none">
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:15px" id="presets"></div>
      <div style="text-align:center"><canvas id="cv" style="max-width:100%;border-radius:8px;box-shadow:var(--shadow)"></canvas></div>
      <div class="btn-group"><button class="btn" onclick="dl()">下载</button><button class="btn btn-outline" onclick="applyFilter('原图')">重置</button></div>
    </div>
    <div class="ad-placeholder">广告位 - Google AdSense</div>
  </div>
  <footer class="footer">免费在线工具箱 © 2024</footer>
  <script src="../js/common.js"></script>
  <script>
  let img,origData,cv,ctx,curFilter='原图';
  const FILTERS={
    '原图':d=>d,
    '黑白':d=>{for(let i=0;i<d.length;i+=4){const g=d[i]*.3+d[i+1]*.59+d[i+2]*.11;d[i]=d[i+1]=d[i+2]=g}return d},
    '复古':d=>{for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];d[i]=Math.min(255,r*.393+g*.769+b*.189);d[i+1]=Math.min(255,r*.349+g*.686+b*.168);d[i+2]=Math.min(255,r*.272+g*.534+b*.131)}return d},
    '暖色':d=>{for(let i=0;i<d.length;i+=4){d[i]=Math.min(255,d[i]+25);d[i+2]=Math.max(0,d[i+2]-20)}return d},
    '冷色':d=>{for(let i=0;i<d.length;i+=4){d[i]=Math.max(0,d[i]-15);d[i+2]=Math.min(255,d[i+2]+25)}return d},
    '高对比':d=>{const f=1.5;for(let i=0;i<d.length;i+=4){d[i]=Math.min(255,Math.max(0,f*(d[i]-128)+128));d[i+1]=Math.min(255,Math.max(0,f*(d[i+1]-128)+128));d[i+2]=Math.min(255,Math.max(0,f*(d[i+2]-128)+128))}return d},
    '柔光':d=>{for(let i=0;i<d.length;i+=4){d[i]=Math.min(255,d[i]+20);d[i+1]=Math.min(255,d[i+1]+15);d[i+2]=Math.min(255,d[i+2]+10);d[i+3]=Math.max(0,d[i+3]-15)}return d},
    '胶片':d=>{for(let i=0;i<d.length;i+=4){d[i]=Math.min(255,d[i]*1.1+10);d[i+1]=Math.min(255,d[i+1]*1.05);d[i+2]=Math.min(255,d[i+2]*.9+20)}return d},
    '鲜艳':d=>{for(let i=0;i<d.length;i+=4){const avg=(d[i]+d[i+1]+d[i+2])/3;d[i]=Math.min(255,d[i]+(d[i]-avg)*.5);d[i+1]=Math.min(255,d[i+1]+(d[i+1]-avg)*.5);d[i+2]=Math.min(255,d[i+2]+(d[i+2]-avg)*.5)}return d},
    '褪色':d=>{for(let i=0;i<d.length;i+=4){const g=d[i]*.3+d[i+1]*.59+d[i+2]*.11;d[i]=d[i]*.6+g*.4;d[i+1]=d[i+1]*.6+g*.4;d[i+2]=d[i+2]*.6+g*.4}return d},
    '反色':d=>{for(let i=0;i<d.length;i+=4){d[i]=255-d[i];d[i+1]=255-d[i+1];d[i+2]=255-d[i+2]}return d},
    '素描':d=>{for(let i=0;i<d.length;i+=4){const g=d[i]*.3+d[i+1]*.59+d[i+2]*.11;const v=g>128?255:0;d[i]=d[i+1]=d[i+2]=v}return d},
    '紫调':d=>{for(let i=0;i<d.length;i+=4){d[i]=Math.min(255,d[i]*1.1+20);d[i+1]=Math.max(0,d[i+1]*.9);d[i+2]=Math.min(255,d[i+2]*1.2+15)}return d},
  };

  document.getElementById('fi').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=ev=>{
      img=new Image();img.onload=()=>{
        cv=document.getElementById('cv');ctx=cv.getContext('2d');
        const maxW=Math.min(700,window.innerWidth-60),s=img.width>maxW?maxW/img.width:1;
        cv.width=img.width*s;cv.height=img.height*s;
        ctx.drawImage(img,0,0,cv.width,cv.height);
        origData=ctx.getImageData(0,0,cv.width,cv.height);
        document.querySelector('.upload-area').style.display='none';
        document.getElementById('editor').style.display='block';
        renderPresets();
      };img.src=ev.target.result;
    };r.readAsDataURL(f);
  };

  function renderPresets(){
    const el=document.getElementById('presets');
    el.innerHTML=Object.keys(FILTERS).map(name=>`<button class="btn btn-sm ${name===curFilter?'':'btn-outline'}" onclick="applyFilter('${name}')" style="min-width:60px">${name}</button>`).join('');
  }

  function applyFilter(name){
    curFilter=name;
    const copy=new ImageData(new Uint8ClampedArray(origData.data),origData.width,origData.height);
    FILTERS[name](copy.data);
    ctx.putImageData(copy,0,0);
    renderPresets();
  }

  function dl(){
    const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
    const x=c.getContext('2d');x.drawImage(img,0,0);
    const d=x.getImageData(0,0,c.width,c.height);
    FILTERS[curFilter](d.data);x.putImageData(d,0,0);
    c.toBlob(b=>downloadBlob(b,'filtered.png'),'image/png');showToast('下载成功！');
  }
  </script>
</body>
</html>
