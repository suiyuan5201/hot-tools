  function seed(s){return function(){s=(s*16807)%2147483647;return(s-1)/2147483646}}
  function todaySeed(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()+Math.floor(d.getHours()/3)}

  function genList(pid,n=25){
    const r=seed(todaySeed()+pid.charCodeAt(0)*97+pid.charCodeAt(1)*13);
    const words=[...(W[pid]||W.weibo)].sort(()=>r()-.5).slice(0,n);
    return words.map((t,i)=>{
      const heat=Math.floor(r()*8000000+500000);
      const badge=i<1?'b-hot':i<2?'b-new':i<3&&r()>.5?'b-rec':'';
      return{rank:i+1,title:t,heat,badge};
    });
  }

  function fmtHeat(n){return n>=10000?(n/10000).toFixed(0)+'万':n+''}

  function renderCard(p){
    const items=genList(p.id);
    return`<div class="card" data-p="${p.id}"><div class="card-head"><div class="card-icon" style="background:${p.color}18;color:${p.color}">${p.icon}</div><span class="card-name">${p.name}</span><span class="card-tag">${p.tag}</span></div><ul class="hot-list">${items.map(it=>`<li class="hot-item" onclick="window.open('https://www.baidu.com/s?wd='+encodeURIComponent('${it.title.replace(/'/g,"\\'")}'),'_blank')"><span class="hot-rank${it.rank<=1?' r1':it.rank<=2?' r2':it.rank<=3?' r3':''}">${it.rank}</span><span class="hot-title">${it.title}</span>${it.badge?`<span class="hot-badge ${it.badge}">${it.badge==='b-hot'?'热':it.badge==='b-new'?'新':'荐'}</span>`:''}<span class="hot-heat">${fmtHeat(it.heat)}</span></li>`).join('')}</ul></div>`;
  }

  function renderAll(){
    document.getElementById('grid').innerHTML=P.map(renderCard).join('');
    document.getElementById('updateTime').textContent=new Date().toLocaleString();
  }

  function refreshAll(){
    const btn=document.querySelector('.refresh-btn');
    btn.classList.add('spin');
    setTimeout(()=>{renderAll();btn.classList.remove('spin');showToast('已刷新');},600);
  }

  // tabs
  (function(){

    bar.innerHTML='<button class="tab-btn active" data-f="all">全部</button>'+P.map(p=>`<button class="tab-btn" data-f="${p.id}">${p.name.replace(/热[搜榜点门话]|Trending/,'')}</button>`).join('');
    bar.addEventListener('click',e=>{
      const b=e.target.closest('.tab-btn');if(!b)return;
      bar.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const f=b.dataset.f;
      document.querySelectorAll('.card').forEach(c=>{c.style.display=(f==='all'||c.dataset.p===f)?'':'none'});
    });
  })();

  renderAll();
  setInterval(renderAll,5*60*1000);
