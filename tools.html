  const CATS=['全部','图片','文本','开发','生活','媒体'];
  let currentCat='全部';

  function renderTabs(){
    document.getElementById('catTabs').innerHTML=CATS.map(c=>`<button class="cat-tab${c===currentCat?' active':''}" onclick="setCat('${c}',this)">${c}${c!=='全部'?' ('+TOOLS.filter(t=>t.cat===c).length+')':''}</button>`).join('');
  }

  function setCat(c,btn){
    currentCat=c;
    document.querySelectorAll('.cat-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    filterTools();
  }

  function filterTools(){
    const q=document.getElementById('searchInput').value.toLowerCase();
    const filtered=TOOLS.filter(t=>{
      const matchCat=currentCat==='全部'||t.cat===currentCat;
      const matchQ=!q||t.name.toLowerCase().includes(q)||t.desc.toLowerCase().includes(q)||t.cat.toLowerCase().includes(q);
      return matchCat&&matchQ;
    });
    renderTools(filtered);
  }

  function renderTools(list){
    document.getElementById('toolCount').textContent=list.length;
    document.getElementById('toolsGrid').innerHTML=list.map(t=>`<a class="tool-card" href="tools/${t.file}"><div class="tc-icon" style="background:${t.color}12;color:${t.color}">${t.icon}</div><div class="tc-name">${t.name}</div><div class="tc-desc">${t.desc}</div><span class="tc-tag">${t.cat}</span></a>`).join('');
  }

  renderTabs();
